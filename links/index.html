<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pack &amp; Nap – Get the app</title>
  <meta name="description" content="Pack &amp; Nap: packing lists for each kid and nap-friendly trip plans. On iPhone and Android in the US and Canada.">
  <meta property="og:title" content="Pack &amp; Nap – Get the app">
  <meta property="og:description" content="The car is running and nothing is packed? There's an app for that.">
  <meta property="og:image" content="icon.png">
  <meta name="theme-color" content="#6c5ce7">
  <link rel="icon" href="icon.png">
  <!--
    LAUNCH SWAP (do not publish before release):
    [App Store link]   -> https://apps.apple.com/app/id6827359792
    [Google Play link] -> https://play.google.com/store/apps/details?id=com.packandnap.app
    Both URLs return 404 until the apps are public.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2c3e50;
      background: #f7f9fc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      text-align: center;
      padding: calc(48px + env(safe-area-inset-top)) 24px 36px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: #fff;
      border-radius: 0 0 28px 28px;
    }
    .icon {
      width: 96px; height: 96px;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      background: #fff;
    }
    h1 { font-size: 2rem; margin: 16px 0 6px; }
    .tagline { font-size: 1.1rem; margin: 0 auto; max-width: 320px; line-height: 1.45; opacity: .96; }
    main {
      width: 100%;
      max-width: 440px;
      padding: 28px 20px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 64px;
      padding: 16px 20px;
      border-radius: 18px;
      font-size: 1.15rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 14px rgba(0,0,0,.08);
      transition: transform .08s ease;
    }
    .btn:active { transform: scale(.98); }
    .btn svg { width: 26px; height: 26px; flex: none; }
    .ios { background: #2c3e50; color: #fff; }
    .android { background: #6c5ce7; color: #fff; }
    .note { text-align: center; font-size: .95rem; color: #5f6b7a; margin: 6px 0 0; }
    footer {
      margin-top: auto;
      padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: .9rem;
      color: #7f8c8d;
    }
    footer a { color: #6c5ce7; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <img class="icon" src="icon.png" alt="Pack &amp; Nap app icon" width="96" height="96">
    <h1>Pack &amp; Nap</h1>
    <p class="tagline">The car is running and nothing is packed? Packing lists for each kid, so you can actually leave.</p>
  </header>

  <main>
    <a class="btn ios" href="[App Store link]" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="1.5" width="12" height="21" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="18.5" r="1.2"/></svg>
      Get it for iPhone
    </a>
    <a class="btn android" href="[Google Play link]" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="1.5" width="12" height="21" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><rect x="10" y="18" width="4" height="1.4" rx=".7"/></svg>
      Get it for Android
    </a>
    <p class="note">Free to download. Available in the US and Canada.</p>
  </main>

  <footer>
    <a href="https://tinytravelersapp.github.io/PackAndNap/privacy/">Privacy Policy</a>
    &nbsp;·&nbsp;
    <a href="https://tinytravelersapp.github.io/PackAndNap/">About Pack &amp; Nap</a>
    <br>© 2026 Pack&amp;Nap LLC
  </footer>
</body>
</html>
